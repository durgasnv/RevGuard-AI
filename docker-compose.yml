version: '3.8'

services:
  revguard-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revguard_ai_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REVGUARD_HOST=0.0.0.0
      - REVGUARD_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
